<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 420" width="100%" height="100%">
  <defs>
    <linearGradient id="pipeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="50%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="nodeSurf" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#152036"/>
      <stop offset="100%" stop-color="#0D1526"/>
    </linearGradient>
    <linearGradient id="gateSurf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="nodeShadow" x="-8%" y="-8%" width="116%" height="124%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <marker id="flowArr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#38BDF8"/>
    </marker>
    <marker id="passArr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#34D399"/>
    </marker>
    <marker id="failArr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#F87171"/>
    </marker>
    <pattern id="pipeDots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#334155" opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Canvas -->
  <rect width="1320" height="420" rx="18" fill="url(#pipeBg)" stroke="#1E293B" stroke-width="2"/>
  <rect width="1320" height="420" rx="18" fill="url(#pipeDots)"/>

  <!-- Header -->
  <rect x="28" y="18" width="1264" height="40" rx="8" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
  <circle cx="50" cy="38" r="4.5" fill="#38BDF8"/>
  <text x="66" y="42" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">END-TO-END AUTONOMOUS EXECUTION &amp; APPROVAL FLOWCHART</text>
  <text x="530" y="42" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">|   Forward TDD Flow   •   Decision Diamonds   •   Automated Reject &amp; Retry Loops</text>

  <!-- STAGE 01: OWNER INTENT & CEO GATE -->
  <g filter="url(#nodeShadow)">
    <rect x="28" y="88" width="164" height="154" rx="12" fill="url(#nodeSurf)" stroke="#F59E0B" stroke-width="2"/>
    <rect x="40" y="100" width="68" height="19" rx="5" fill="#F59E0B" fill-opacity="0.2"/>
    <text x="74" y="113" text-anchor="middle" fill="#FBBF24" font-family="monospace" font-size="10" font-weight="700">STAGE 01</text>
    <text x="110" y="138" text-anchor="middle" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">Owner Intent &amp;</text>
    <text x="110" y="155" text-anchor="middle" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">CEO Gate</text>
    <text x="110" y="177" text-anchor="middle" fill="#5EEAD4" font-family="monospace" font-size="9.5" font-weight="600">role-ceo-governance</text>
    <text x="110" y="198" text-anchor="middle" fill="#CBD5E1" font-family="system-ui, -apple-system, sans-serif" font-size="10">Checks standing rules,</text>
    <text x="110" y="213" text-anchor="middle" fill="#CBD5E1" font-family="system-ui, -apple-system, sans-serif" font-size="10">logs Go, writes handoff</text>
  </g>
  <line x1="192" y1="165" x2="218" y2="165" stroke="#38BDF8" stroke-width="2.2" marker-end="url(#flowArr)"/>

  <!-- STAGE 02: PM SPEC & 8-STATE UI -->
  <g filter="url(#nodeShadow)">
    <rect x="222" y="88" width="164" height="154" rx="12" fill="url(#nodeSurf)" stroke="#3B82F6" stroke-width="2"/>
    <rect x="234" y="100" width="68" height="19" rx="5" fill="#3B82F6" fill-opacity="0.2"/>
    <text x="268" y="113" text-anchor="middle" fill="#60A5FA" font-family="monospace" font-size="10" font-weight="700">STAGE 02</text>
    <text x="304" y="138" text-anchor="middle" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">Slice Spec &amp;</text>
    <text x="304" y="155" text-anchor="middle" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">8-State UI</text>
    <text x="304" y="177" text-anchor="middle" fill="#93C5FD" font-family="monospace" font-size="9.5" font-weight="600">pm + uiux-design-spec</text>
    <text x="304" y="198" text-anchor="middle" fill="#CBD5E1" font-family="system-ui, -apple-system, sans-serif" font-size="10">4-way tracker sync,</text>
    <text x="304" y="213" text-anchor="middle" fill="#CBD5E1" font-family="system-ui, -apple-system, sans-serif" font-size="10">S-### spec &amp; 390px UI</text>
  </g>
  <line x1="386" y1="165" x2="412" y2="165" stroke="#38BDF8" stroke-width="2.2" marker-end="url(#flowArr)"/>

  <!-- DIAMOND GATE A: DESIGN & HARD-STOP GO? -->
  <g filter="url(#nodeShadow)">
    <polygon points="466,115 518,165 466,215 414,165" fill="url(#gateSurf)" stroke="#EC4899" stroke-width="2"/>
    <text x="466" y="161" text-anchor="middle" fill="#F472B6" font-family="monospace" font-size="9.5" font-weight="700">DESIGN &amp;</text>
    <text x="466" y="174" text-anchor="middle" fill="#F472B6" font-family="monospace" font-size="9.5" font-weight="700">SCHEMA GO?</text>
  </g>
  <!-- Hold Loop back to Stage 01 -->
  <path d="M 466 115 L 466 72 L 110 72 L 110 86" fill="none" stroke="#F87171" stroke-width="1.6" stroke-dasharray="4,2" marker-end="url(#failArr)"/>
  <text x="288" y="66" text-anchor="middle" fill="#FCA5A5" font-family="monospace" font-size="9">[NO GO: Request Owner Approval via CEO]</text>
  <line x1="518" y1="165" x2="546" y2="165" stroke="#34D399" stroke-width="2.2" marker-end="url(#passArr)"/>

  <!-- STAGE 03: TDD SLICE BUILD -->
  <g filter="url(#nodeShadow)">
    <rect x="550" y="88" width="164" height="154" rx="12" fill="url(#nodeSurf)" stroke="#10B981" stroke-width="2"/>
    <rect x="562" y="100" width="68" height="19" rx="5" fill="#10B981" fill-opacity="0.2"/>
    <text x="596" y="113" text-anchor="middle" fill="#34D399" font-family="monospace" font-size="10" font-weight="700">STAGE 03</text>
    <text x="632" y="138" text-anchor="middle" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">TDD Slice Build</text>
    <text x="632" y="155" text-anchor="middle" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">&amp; Local Audit</text>
    <text x="632" y="177" text-anchor="middle" fill="#6EE7B7" font-family="monospace" font-size="9.5" font-weight="600">role-dev-slice-tdd</text>
    <text x="632" y="198" text-anchor="middle" fill="#CBD5E1" font-family="system-ui, -apple-system, sans-serif" font-size="10">Failing tests first, tenant</text>
    <text x="632" y="213" text-anchor="middle" fill="#CBD5E1" font-family="system-ui, -apple-system, sans-serif" font-size="10">isolation &amp; PR Evidence</text>
  </g>
  <line x1="714" y1="165" x2="740" y2="165" stroke="#38BDF8" stroke-width="2.2" marker-end="url(#flowArr)"/>

  <!-- STAGE 04: ADVERSARIAL QA & IDOR SWEEP -->
  <g filter="url(#nodeShadow)">
    <rect x="744" y="88" width="164" height="154" rx="12" fill="url(#nodeSurf)" stroke="#EF4444" stroke-width="2"/>
    <rect x="756" y="100" width="68" height="19" rx="5" fill="#EF4444" fill-opacity="0.2"/>
    <text x="790" y="113" text-anchor="middle" fill="#F87171" font-family="monospace" font-size="10" font-weight="700">STAGE 04</text>
    <text x="826" y="138" text-anchor="middle" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">Adversarial QA</text>
    <text x="826" y="155" text-anchor="middle" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">&amp; IDOR Sweep</text>
    <text x="826" y="177" text-anchor="middle" fill="#FCA5A5" font-family="monospace" font-size="9.5" font-weight="600">role-qa-adversarial</text>
    <text x="826" y="198" text-anchor="middle" fill="#CBD5E1" font-family="system-ui, -apple-system, sans-serif" font-size="10">Cross-tenant probes,</text>
    <text x="826" y="213" text-anchor="middle" fill="#CBD5E1" font-family="system-ui, -apple-system, sans-serif" font-size="10">role bounds &amp; QA-H-###</text>
  </g>
  <line x1="908" y1="165" x2="934" y2="165" stroke="#38BDF8" stroke-width="2.2" marker-end="url(#flowArr)"/>

  <!-- DIAMOND GATE B: 8-POINT MERGE GATE -->
  <g filter="url(#nodeShadow)">
    <polygon points="988,115 1040,165 988,215 936,165" fill="url(#gateSurf)" stroke="#6366F1" stroke-width="2"/>
    <text x="988" y="161" text-anchor="middle" fill="#A5B4FC" font-family="monospace" font-size="9.5" font-weight="700">8-POINT</text>
    <text x="988" y="174" text-anchor="middle" fill="#A5B4FC" font-family="monospace" font-size="9.5" font-weight="700">GATE PASS?</text>
  </g>
  <!-- Reject Loop from Gate B back to Stage 03 Developer -->
  <path d="M 988 215 L 988 268 L 632 268 L 632 244" fill="none" stroke="#F87171" stroke-width="1.8" stroke-dasharray="4,2" marker-end="url(#failArr)"/>
  <rect x="705" y="257" width="210" height="20" rx="4" fill="#0F172A" stroke="#EF4444" stroke-width="1"/>
  <text x="810" y="271" text-anchor="middle" fill="#FCA5A5" font-family="monospace" font-size="9.5" font-weight="600">[REJECT: Fix Bugs / Max 3 Retries]</text>

  <line x1="1040" y1="165" x2="1068" y2="165" stroke="#34D399" stroke-width="2.2" marker-end="url(#passArr)"/>

  <!-- STAGE 05 & 06: PINNED MERGE, DEVOPS, GTM & ONBOARDING -->
  <g filter="url(#nodeShadow)">
    <rect x="1072" y="88" width="220" height="154" rx="12" fill="url(#nodeSurf)" stroke="#8B5CF6" stroke-width="2"/>
    <rect x="1084" y="100" width="96" height="19" rx="5" fill="#8B5CF6" fill-opacity="0.2"/>
    <text x="1132" y="113" text-anchor="middle" fill="#C4B5FD" font-family="monospace" font-size="10" font-weight="700">STAGE 05 - 06</text>
    <text x="1182" y="138" text-anchor="middle" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">Pinned SHA Merge,</text>
    <text x="1182" y="155" text-anchor="middle" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">Deploy, GTM &amp; Ops</text>
    <text x="1182" y="177" text-anchor="middle" fill="#C4B5FD" font-family="monospace" font-size="9.5" font-weight="600">eng-lead + devops + gtm + ops</text>
    <text x="1182" y="198" text-anchor="middle" fill="#CBD5E1" font-family="system-ui, -apple-system, sans-serif" font-size="10">Squash-merge by 40-char SHA,</text>
    <text x="1182" y="213" text-anchor="middle" fill="#CBD5E1" font-family="system-ui, -apple-system, sans-serif" font-size="10">TEST deploy, SEO, onboarding</text>
  </g>

  <!-- Continuous Verification & Evening Summary Loop (Bottom) -->
  <g filter="url(#nodeShadow)">
    <rect x="28" y="302" width="1264" height="92" rx="12" fill="#0F172A" stroke="#14B8A6" stroke-width="1.6"/>
    <rect x="44" y="316" width="228" height="22" rx="5" fill="#14B8A6" fill-opacity="0.18"/>
    <text x="158" y="331" text-anchor="middle" fill="#5EEAD4" font-family="monospace" font-size="10.5" font-weight="700">DETERMINISTIC GATEKEEPER</text>
    <text x="290" y="331" fill="#F8FAFC" font-family="monospace" font-size="11.5" font-weight="700">python3 scripts/verify_output.py --mode [summary | approval | handoff | slice | qa] --file &lt;output.md&gt;</text>
    <text x="44" y="358" fill="#CBD5E1" font-family="system-ui, -apple-system, sans-serif" font-size="11">• Every node runs its local verifier before handoff: blocks em-dashes, leaked secrets/tokens, unparameterized SQL, and missing Evidence sections.</text>
    <text x="44" y="378" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="11">• Completed stages return PR/QA evidence links to 01. CEO, which updates the Approvals Log and delivers one concise Evening Summary to the Owner.</text>
  </g>
</svg>
